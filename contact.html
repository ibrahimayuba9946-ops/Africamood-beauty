
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Africamood Beauty</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="intro">
        <p class="eyebrow">AFRICAMOOD BEAUTY</p>
        <h1>Contactez-nous</h1>
        <p>Une question sur notre sérum ? Écrivez-nous.</p>

        <form id="contact-form">
            <label for="nom">Nom complet</label>
            <input type="text" id="nom" name="nom" required>

            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" required>

            <label for="sujet">Sujet</label>
            <input type="text" id="sujet" name="sujet" required>

            <label for="message-contact">Votre message</label>
            <textarea id="message-contact" name="message"
                      rows="5" required></textarea>

            <button class="button" type="submit">Envoyer</button>
        </form>

        <p id="confirmation"></p>
        <a class="button" href="index.html">Retour à l'accueil</a>
    </main>

    <script src="script.js"></script>
</body>
</html>
