
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Africamood Beauty</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="intro">
        <p class="eyebrow">AFRICAMOOD BEAUTY</p>

        <h1>Rejoignez notre univers beauté</h1>

        <p>
            Inscrivez-vous pour découvrir nos conseils beauté
            et recevoir nos actualités.
        </p>

        <form id="signup-form">
            <label for="nom">Nom complet</label>
            <input type="text" id="nom" name="nom"
                   placeholder="Votre nom" required>

            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="Votre adresse e-mail" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password"
                   placeholder="Choisissez un mot de passe"
                   minlength="8" required>

            <button class="button" type="submit">
                Créer mon compte
            </button>
        </form>

        <p id="message"></p>

        <a class="button" href="index.html">Retour à l'accueil</a>
    </main>

    <script src="script.js"></script>
</body>
</html>
